static_resources:
  listeners:
    - name: media_grpc_web
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9091
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: media_grpc_web
                codec_type: AUTO
                route_config:
                  name: media_grpc_web_route
                  virtual_hosts:
                    - name: media_grpc_web
                      domains: ["*"]
                      cors:
                        allow_origin_string_match:
                          - exact: http://localhost:3000
                          - exact: http://127.0.0.1:3000
                          - exact: http://localhost:3001
                          - exact: http://127.0.0.1:3001
                          - exact: http://localhost:3002
                          - exact: http://127.0.0.1:3002
                          - exact: http://localhost:3003
                          - exact: http://127.0.0.1:3003
                          - exact: http://localhost:3100
                          - exact: http://127.0.0.1:3100
                          - exact: http://localhost:3103
                          - exact: http://127.0.0.1:3103
                        allow_methods: POST, OPTIONS
                        allow_headers: authorization,content-type,x-grpc-web,x-user-agent,grpc-timeout
                        expose_headers: grpc-status,grpc-message
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: media_grpc
                            timeout: 30s
                http_filters:
                  - name: envoy.filters.http.grpc_web
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                  - name: envoy.filters.http.cors
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: media_grpc
      connect_timeout: 2s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: media_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: host.docker.internal
                      port_value: 9090
