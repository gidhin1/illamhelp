name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.76.2

jobs:
  quality:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Ensure Maven is available
        run: bash scripts/ci-setup-maven.sh
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$(uname -m)" in
            x86_64)
              platform=linux_x64
              checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              ;;
            aarch64)
              platform=linux_arm64
              checksum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
              ;;
            *) echo 'Unsupported Gitleaks runner architecture' >&2; exit 1 ;;
          esac
          archive="gitleaks_${GITLEAKS_VERSION}_${platform}.tar.gz"
          scan_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$scan_dir/$archive"
          printf '%s  %s\n' "$checksum" "$scan_dir/$archive" | sha256sum --check
          tar -xzf "$scan_dir/$archive" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git --redact --no-banner .

  trivy:
    name: Vulnerability Scan (Trivy FS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Ensure Maven is available
        run: bash scripts/ci-setup-maven.sh
      - name: Warm Maven dependency cache
        run: mvn -B -f api-java/pom.xml -DskipTests dependency:go-offline
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@df678dbccf677bc6937338d569ba0da18964a8cc
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"

  trivy-images:
    name: Container Image Scan (Critical)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
          - redis@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
          - docker.io/pgsty/silo@sha256:08ce1505b5eacefbad1ca07159b242b9ce045a11c2817e3bc257b25f77bbc02d
          - nats@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
          - opensearchproject/opensearch:3.10.0@sha256:02d6d6e40c820ae08233b60540aa5d3d9364d64e2dc724e38d6c8c794879b2a0
          - quay.io/keycloak/keycloak:26.8.2@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
          - openpolicyagent/opa@sha256:564adcf7657817d3d8cab1ef6ae2612744209ddbe5e1b9773626fb2602c04db5
          - clamav/clamav-debian:stable@sha256:cb2b6fa0bf480a3c243117204b751f062c5350569d088dc269ebeef6b4331823
          - envoyproxy/envoy:v1.35-latest@sha256:a707c3821b4cecb5db43d8e86e983e0f57b81010fefbabc01feeb071fb8cc08e
          - curlimages/curl@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Scan pinned image
        uses: aquasecurity/trivy-action@df678dbccf677bc6937338d569ba0da18964a8cc
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ matrix.image }}
          scan-type: image
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"
          timeout: 10m
          trivyignores: infra/trivy-image-exceptions.txt

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Run Semgrep
        run: semgrep scan --config auto --error --exclude node_modules

  build:
    name: Build (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Ensure Maven is available
        run: bash scripts/ci-setup-maven.sh
      - name: Build with Maven
        run: mvn clean compile
        working-directory: api-java

  helm:
    name: Helm Lint And Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.19.0
      - name: Helm validation
        run: |
          helm lint charts/illamhelp-local-infra charts/illamhelp-app
          helm template illamhelp charts/illamhelp-local-infra --namespace illamhelp >/tmp/illamhelp-local-infra.yaml
          helm template illamhelp charts/illamhelp-local-infra --namespace illamhelp --set opensearch.enabled=true >/tmp/illamhelp-local-infra-with-search.yaml
          helm template illamhelp-app charts/illamhelp-app --namespace illamhelp >/tmp/illamhelp-app.yaml
          helm template illamhelp-app charts/illamhelp-app --namespace illamhelp \
            --set images.api.repository=illamhelp/api-speech \
            --set-string config.clamavHost=illamhelp-clamav >/tmp/illamhelp-app-with-speech.yaml
          helm template illamhelp-app charts/illamhelp-app --namespace illamhelp \
            --values charts/illamhelp-app/values-visual.yaml \
            --set images.api.repository=illamhelp/api-visual \
            --set-string config.clamavHost=illamhelp-clamav >/tmp/illamhelp-app-with-visual.yaml

  app-images:
    name: Build And Scan App Images
    runs-on: ubuntu-latest
    needs: [quality, trivy, trivy-images, semgrep, gitleaks, build, helm]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: api
            dockerfile: infra/docker/api.Dockerfile
          - name: api-speech
            dockerfile: infra/docker/api.Dockerfile
            target: speech
          - name: api-visual
            dockerfile: infra/docker/api.Dockerfile
            target: visual
          - name: web
            dockerfile: infra/docker/web.Dockerfile
          - name: admin
            dockerfile: infra/docker/admin.Dockerfile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Build image
        env:
          BUILD_TARGET: ${{ matrix.app.target }}
          DOCKERFILE: ${{ matrix.app.dockerfile }}
          APP_IMAGE: illamhelp/${{ matrix.app.name }}:${{ github.sha }}
        run: |
          args=()
          if [[ -n "$BUILD_TARGET" ]]; then args+=(--target "$BUILD_TARGET"); fi
          docker build "${args[@]}" -f "$DOCKERFILE" -t "$APP_IMAGE" .
      - name: Check speech tools offline
        if: matrix.app.target == 'speech' || matrix.app.target == 'visual'
        env:
          APP_IMAGE: illamhelp/${{ matrix.app.name }}:${{ github.sha }}
        run: |
          docker run --rm --network none --read-only --entrypoint /bin/sh "$APP_IMAGE" -ec '
            test "$(id -u)" = 10001
            test -r "$VIDEO_WHISPER_MODEL"
            "$VIDEO_WHISPER_EXECUTABLE" --version
            "$VIDEO_FFMPEG_EXECUTABLE" -version >/dev/null
            "$VIDEO_FFPROBE_EXECUTABLE" -version >/dev/null
            "$PHOTO_OCR_EXECUTABLE" --list-langs | grep -qx mal
          '
      - name: Run visual inference offline
        if: matrix.app.target == 'visual'
        env:
          APP_IMAGE: illamhelp/${{ matrix.app.name }}:${{ github.sha }}
        run: |
          test "$(uname -m)" = x86_64
          docker run --rm --network none --read-only --cpus 2 --memory 2g \
            --tmpfs /tmp:rw,nosuid,size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 \
            --entrypoint /bin/bash "$APP_IMAGE" -euo pipefail -c '
              test -r "$MEDIA_VISUAL_MODEL_DIRECTORY/LICENSE"
              test ! -w "$MEDIA_VISUAL_MODEL_DIRECTORY/model.safetensors"
              python -c "import sys; from PIL import Image; Image.new(\"RGB\", (224,224), \"white\").save(sys.stdout.buffer, \"PNG\")" |
                time timeout 15s "$MEDIA_VISUAL_EXECUTABLE" |
                python -c "import sys; score=float(sys.stdin.read()); assert 0 <= score <= 1; print(score)"
            '
      - name: Scan image
        uses: aquasecurity/trivy-action@df678dbccf677bc6937338d569ba0da18964a8cc
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: illamhelp/${{ matrix.app.name }}:${{ github.sha }}
          scan-type: image
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
          timeout: 10m
      - name: Publish image to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.app.name }}:${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "illamhelp/${{ matrix.app.name }}:${{ github.sha }}" "$GHCR_IMAGE"
          docker push "$GHCR_IMAGE"
