packages:
  - "mobile"
  - "admin"
  - "web"
  - "packages/*"

minimumReleaseAge: 10080
trustPolicy: no-downgrade
trustPolicyExclude:
  - "eslint-import-resolver-typescript"
  - "semver"
  - "ua-parser-js"
  - "undici-types"
blockExoticSubdeps: true

packageExtensions:
  "@expo/metro-config@0.20.18":
    dependencies:
      "@babel/template": "^7.27.0"
