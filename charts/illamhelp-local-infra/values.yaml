# kind's default dynamic storage class.
storageClassName: standard

# Use the Secret generated from .env by make k8s-up.
secrets:
  create: false
  name: illamhelp-secrets
  values: {}

# Stateful dependency sizing and local resource budgets.
postgres:
  replicas: 1
  size: 1Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
redis:
  replicas: 1
  size: 512Mi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
minio:
  replicas: 1
  size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
nats:
  replicas: 1
  size: 512Mi
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }
keycloak:
  replicas: 1
