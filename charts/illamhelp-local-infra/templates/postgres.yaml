apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "illamhelp-local-infra.fullname" . }}-postgres
  labels:
    {{- include "illamhelp-local-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "illamhelp-local-infra.fullname" . }}-postgres
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "illamhelp-local-infra.podSecurityContext" . | nindent 8 }}
      containers:
        - name: postgres
          securityContext:
            allowPrivilegeEscalation: false
          image: {{ .Values.images.postgres | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: illamhelp
          envFrom:
            - secretRef:
                name: {{ include "illamhelp-local-infra.secretName" . }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "illamhelp"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "illamhelp-local-infra.fullname" . }}-postgres
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
