apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "illamhelp-local-infra.fullname" . }}-keycloak-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "illamhelp-local-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-bootstrap
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: keycloak-bootstrap
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "illamhelp-local-infra.podSecurityContext" . | nindent 8 }}
      restartPolicy: OnFailure
      containers:
        - name: keycloak-bootstrap
          securityContext:
            allowPrivilegeEscalation: false
          image: {{ .Values.images.keycloak | quote }}
          envFrom:
            - secretRef:
                name: {{ include "illamhelp-local-infra.secretName" . }}
            {{- with .Values.keycloak.memberWebSecretName }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              KC_URL="http://{{ include "illamhelp-local-infra.fullname" . }}-keycloak:8080"
              until /opt/keycloak/bin/kcadm.sh config credentials --server "$KC_URL" --realm master --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD"; do sleep 5; done
              /opt/keycloak/bin/kcadm.sh get realms/illamhelp >/dev/null 2>&1 || /opt/keycloak/bin/kcadm.sh create realms -s realm=illamhelp -s enabled=true -s sslRequired=NONE
              /opt/keycloak/bin/kcadm.sh get clients -r illamhelp -q clientId=illamhelp-api | grep -q illamhelp-api || /opt/keycloak/bin/kcadm.sh create clients -r illamhelp -s clientId=illamhelp-api -s publicClient=true -s enabled=true -s directAccessGrantsEnabled=true
              CLIENT_ID="$(/opt/keycloak/bin/kcadm.sh get clients -r illamhelp -q clientId=illamhelp-api --fields id --format csv --noquotes | tail -n 1)"
              for role in both seeker provider admin support; do
                /opt/keycloak/bin/kcadm.sh get clients/$CLIENT_ID/roles/$role -r illamhelp >/dev/null 2>&1 || /opt/keycloak/bin/kcadm.sh create clients/$CLIENT_ID/roles -r illamhelp -s name=$role
              done

              if [[ -n "${WEB_AUTH_ORIGIN:-}" && -n "${WEB_AUTH_CLIENT_SECRET:-}" ]]; then
                kc=/opt/keycloak/bin/kcadm.sh
                web_client_id=$("$kc" get clients -r illamhelp -q clientId=illamhelp-member-web --fields id                   --format csv --noquotes | tail -n 1)
                web_config=(
                  -s enabled=true -s protocol=openid-connect -s publicClient=false
                  -s standardFlowEnabled=true -s directAccessGrantsEnabled=false
                  -s implicitFlowEnabled=false -s serviceAccountsEnabled=false
                  -s "secret=$WEB_AUTH_CLIENT_SECRET"
                  -s "redirectUris=[\"${WEB_AUTH_ORIGIN%/}/auth/oidc/callback\"]"
                  -s 'attributes={"pkce.code.challenge.method":"S256"}'
                )
                if [[ -z "$web_client_id" ]]; then
                  web_client_id=$("$kc" create clients -r illamhelp -i -s clientId=illamhelp-member-web "${web_config[@]}")
                else
                  "$kc" update "clients/$web_client_id" -r illamhelp "${web_config[@]}"
                fi
                mapper_path="clients/$web_client_id/protocol-mappers/models"
                mapper_id=$("$kc" get "$mapper_path" -r illamhelp --fields id,name --format csv --noquotes |
                  sed -n 's/,illamhelp-api-audience$//p')
                mapper_config=(
                  -s name=illamhelp-api-audience -s protocol=openid-connect -s protocolMapper=oidc-audience-mapper
                  -s 'config={"included.client.audience":"illamhelp-api","access.token.claim":"true","id.token.claim":"false"}'
                )
                if [[ -z "$mapper_id" ]]; then
                  "$kc" create "$mapper_path" -r illamhelp "${mapper_config[@]}"
                else
                  "$kc" update "$mapper_path/$mapper_id" -r illamhelp "${mapper_config[@]}"
                fi
                if [[ -n "${KEYCLOAK_SMTP_CONFIG:-}" ]]; then
                  "$kc" update realms/illamhelp -s "smtpServer=$KEYCLOAK_SMTP_CONFIG" -s resetPasswordAllowed=true
                fi
              fi
