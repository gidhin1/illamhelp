apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "illamhelp-local-infra.fullname" . }}-keycloak-bootstrap
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    {{- include "illamhelp-local-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-bootstrap
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: keycloak-bootstrap
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "illamhelp-local-infra.podSecurityContext" . | nindent 8 }}
      restartPolicy: OnFailure
      containers:
        - name: keycloak-bootstrap
          securityContext:
            allowPrivilegeEscalation: false
          image: {{ .Values.images.keycloak | quote }}
          envFrom:
            - secretRef:
                name: {{ include "illamhelp-local-infra.secretName" . }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              KC_URL="http://{{ include "illamhelp-local-infra.fullname" . }}-keycloak:8080"
              until /opt/keycloak/bin/kcadm.sh config credentials --server "$KC_URL" --realm master --user "$KEYCLOAK_ADMIN" --password "$KEYCLOAK_ADMIN_PASSWORD"; do sleep 5; done
              /opt/keycloak/bin/kcadm.sh get realms/illamhelp >/dev/null 2>&1 || /opt/keycloak/bin/kcadm.sh create realms -s realm=illamhelp -s enabled=true -s sslRequired=NONE
              /opt/keycloak/bin/kcadm.sh get clients -r illamhelp -q clientId=illamhelp-api | grep -q illamhelp-api || /opt/keycloak/bin/kcadm.sh create clients -r illamhelp -s clientId=illamhelp-api -s publicClient=true -s enabled=true -s directAccessGrantsEnabled=true
              CLIENT_ID="$(/opt/keycloak/bin/kcadm.sh get clients -r illamhelp -q clientId=illamhelp-api --fields id --format csv --noquotes | tail -n 1)"
              for role in both seeker provider admin support; do
                /opt/keycloak/bin/kcadm.sh get clients/$CLIENT_ID/roles/$role -r illamhelp >/dev/null 2>&1 || /opt/keycloak/bin/kcadm.sh create clients/$CLIENT_ID/roles -r illamhelp -s name=$role
              done
