apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "illamhelp-local-infra.fullname" . }}-opa-policies
  labels:
    {{- include "illamhelp-local-infra.labels" . | nindent 4 }}
data:
  pii.rego: |
{{ .Files.Get "files/pii.rego" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "illamhelp-local-infra.fullname" . }}-opa
  labels:
    {{- include "illamhelp-local-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: opa
spec:
  replicas: {{ .Values.opa.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: opa
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: opa
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "illamhelp-local-infra.podSecurityContext" . | nindent 8 }}
      containers:
        - name: opa
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          image: {{ .Values.images.opa | quote }}
          args: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
          ports:
            - name: http
              containerPort: 8181
          volumeMounts:
            - name: policies
              mountPath: /policies/pii.rego
              subPath: pii.rego
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health?plugins
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.opa.resources | nindent 12 }}
      volumes:
        - name: policies
          configMap:
            name: {{ include "illamhelp-local-infra.fullname" . }}-opa-policies
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "illamhelp-local-infra.fullname" . }}-opa
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: opa
  ports:
    - name: http
      port: 8181
