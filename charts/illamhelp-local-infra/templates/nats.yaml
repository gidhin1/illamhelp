apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "illamhelp-local-infra.fullname" . }}-nats
  labels:
    {{- include "illamhelp-local-infra.labels" . | nindent 4 }}
    app.kubernetes.io/component: nats
spec:
  serviceName: {{ include "illamhelp-local-infra.fullname" . }}-nats
  replicas: {{ .Values.nats.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: nats
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "illamhelp-local-infra.podSecurityContext" . | nindent 8 }}
      containers:
        - name: nats
          securityContext:
            allowPrivilegeEscalation: false
          image: {{ .Values.images.nats | quote }}
          command: ["sh", "-c", "nats-server -js -sd /data -m 8222 --user \"$NATS_USER\" --pass \"$NATS_PASSWORD\""]
          envFrom:
            - secretRef:
                name: {{ include "illamhelp-local-infra.secretName" . }}
          ports:
            - name: client
              containerPort: 4222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.nats.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "illamhelp-local-infra.fullname" . }}-nats
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nats
  ports:
    - name: client
      port: 4222
    - name: monitor
      port: 8222
