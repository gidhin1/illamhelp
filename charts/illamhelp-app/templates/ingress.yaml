{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "illamhelp-app.fullname" . }}
  labels:
    {{- include "illamhelp-app.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.hosts.web }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "illamhelp-app.fullname" . }}-web
                port:
                  name: http
    - host: {{ .Values.hosts.admin }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "illamhelp-app.fullname" . }}-admin
                port:
                  name: http
    - host: {{ .Values.hosts.api }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "illamhelp-app.fullname" . }}-api
                port:
                  name: http
    - host: {{ .Values.hosts.grpc }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "illamhelp-app.fullname" . }}-envoy
                port:
                  name: http
    {{- if .Values.ingress.keycloakHost }}
    - host: {{ .Values.ingress.keycloakHost }}
      http:
        paths:
          {{- range list (printf "/realms/%s" .Values.config.keycloakRealm) "/resources" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Values.ingress.keycloakServiceName }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
