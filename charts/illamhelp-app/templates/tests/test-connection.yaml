apiVersion: v1
kind: Pod
metadata:
  name: {{ include "illamhelp-app.fullname" . }}-test-connection
  labels:
    {{- include "illamhelp-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    runAsGroup: 101
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: {{ .Values.test.image | quote }}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      command: ["sh", "-ec"]
      args:
        - >-
          curl -fsS http://{{ include "illamhelp-app.fullname" . }}-api:{{ .Values.api.httpPort }}/api/v1/health &&
          curl -fsS -o /dev/null http://{{ include "illamhelp-app.fullname" . }}-web:{{ .Values.web.port }}/ &&
          curl -fsS -o /dev/null http://{{ include "illamhelp-app.fullname" . }}-admin:{{ .Values.admin.port }}/
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
