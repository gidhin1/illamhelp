{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "illamhelp-app.fullname" . }}
  labels:
    {{- include "illamhelp-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        {{- with .Values.networkPolicy.ingressNamespaceLabels }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ .Values.api.httpPort }} }
        - { protocol: TCP, port: {{ .Values.api.grpcPort }} }
        - { protocol: TCP, port: {{ .Values.web.port }} }
        - { protocol: TCP, port: {{ .Values.admin.port }} }
        - { protocol: TCP, port: {{ .Values.envoy.port }} }
{{- end }}
