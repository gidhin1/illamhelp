apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "illamhelp-app.fullname" . }}-api
  labels:
    {{- include "illamhelp-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "illamhelp-app.podSecurityContext" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          securityContext:
            {{- include "illamhelp-app.containerSecurityContext" . | nindent 12 }}
            runAsUser: 10001
            runAsGroup: 10001
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.httpPort }}
            - name: grpc
              containerPort: {{ .Values.api.grpcPort }}
          env:
            - name: PORT
              value: {{ .Values.api.httpPort | quote }}
            - name: GRPC_PORT
              value: {{ .Values.api.grpcPort | quote }}
          envFrom:
            - configMapRef:
                name: {{ include "illamhelp-app.fullname" . }}-config
            - secretRef:
                name: {{ include "illamhelp-app.secretName" . }}
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "illamhelp-app.fullname" . }}-api
  labels:
    {{- include "illamhelp-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.httpPort }}
      targetPort: http
    - name: grpc
      port: {{ .Values.api.grpcPort }}
      targetPort: grpc
