apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "illamhelp-app.fullname" . }}-envoy
  labels:
    {{- include "illamhelp-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: media_grpc_web
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.envoy.port }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: media_grpc_web
                    codec_type: AUTO
                    route_config:
                      name: media_grpc_web_route
                      virtual_hosts:
                        - name: media_grpc_web
                          domains: ["*"]
                          cors:
                            allow_origin_string_match:
                              - exact: http://{{ .Values.hosts.web }}
                              - exact: http://{{ .Values.hosts.admin }}
                              - exact: http://localhost:3000
                              - exact: http://localhost:3003
                            allow_methods: POST, OPTIONS
                            allow_headers: authorization,content-type,x-grpc-web,x-user-agent,grpc-timeout
                            expose_headers: grpc-status,grpc-message
                          routes:
                            - match:
                                prefix: /
                              route:
                                cluster: media_grpc
                                timeout: 30s
                    http_filters:
                      - name: envoy.filters.http.grpc_web
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                      - name: envoy.filters.http.cors
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: media_grpc
          connect_timeout: 2s
          type: STRICT_DNS
          dns_lookup_family: V4_ONLY
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: media_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ include "illamhelp-app.fullname" . }}-api
                          port_value: {{ .Values.api.grpcPort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "illamhelp-app.fullname" . }}-envoy
  labels:
    {{- include "illamhelp-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
spec:
  replicas: {{ .Values.envoy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: envoy
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: envoy
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "illamhelp-app.podSecurityContext" . | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: envoy
          securityContext:
            {{- include "illamhelp-app.containerSecurityContext" . | nindent 12 }}
            runAsUser: 101
            runAsGroup: 101
          image: "{{ .Values.images.envoy.repository }}:{{ .Values.images.envoy.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.envoy.port }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.envoy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "illamhelp-app.fullname" . }}-envoy
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "illamhelp-app.fullname" . }}-envoy
  labels:
    {{- include "illamhelp-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: envoy
  ports:
    - name: http
      port: {{ .Values.envoy.port }}
      targetPort: http
