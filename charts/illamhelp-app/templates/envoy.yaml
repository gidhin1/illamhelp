apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "illamhelp-app.fullname" . }}-envoy
  labels:
    {{- include "illamhelp-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: media_grpc_web
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.envoy.port }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: media_grpc_web
                    codec_type: AUTO
                    route_config:
                      name: media_grpc_web_route
                      virtual_hosts:
                        - name: media_grpc_web
                          domains: ["*"]
                          cors:
                            allow_origin_string_match:
                              - exact: http://{{ .Values.hosts.web }}
                              - exact: http://{{ .Values.hosts.admin }}
                              - exact: http://localhost:3000
                              - exact: http://localhost:3003
                            allow_methods: POST, OPTIONS
                            allow_headers: authorization,content-type,x-grpc-web,x-user-agent,grpc-timeout
                            expose_headers: grpc-status,grpc-message
                          routes:
                            - match:
                                prefix: /
                              route:
                                cluster: media_grpc
                                timeout: 30s
                    http_filters:
                      - name: envoy.filters.http.grpc_web
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb
                      - name: envoy.filters.http.cors
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        {{- if .Values.envoy.memberHttps.tlsSecretName }}
        - name: member_https
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.envoy.memberHttps.port }}
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_certificates:
                      - certificate_chain:
                          filename: /etc/envoy/member-tls/tls.crt
                        private_key:
                          filename: /etc/envoy/member-tls/tls.key
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: member_https
                    codec_type: AUTO
                    route_config:
                      name: member_https_routes
                      virtual_hosts:
                        - name: member_https
                          domains: [{{ .Values.envoy.memberHttps.authority | quote }}]
                          request_headers_to_remove: ["forwarded", "x-forwarded-host", "x-forwarded-port", "x-forwarded-prefix"]
                          routes:
                            - match:
                                path_separated_prefix: {{ printf "/realms/%s" .Values.config.keycloakRealm | quote }}
                              route:
                                cluster: member_keycloak
                            - match:
                                path_separated_prefix: /resources
                              route:
                                cluster: member_keycloak
                            - match:
                                path_separated_prefix: /api/v1
                              route:
                                cluster: member_api
                            - match:
                                path_separated_prefix: /media.v1.MediaService
                              route:
                                cluster: member_grpc_web
                            - match:
                                prefix: /
                              route:
                                cluster: member_web
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        {{- end }}
      clusters:
        - name: media_grpc
          connect_timeout: 2s
          type: STRICT_DNS
          dns_lookup_family: V4_ONLY
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: media_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ include "illamhelp-app.fullname" . }}-api
                          port_value: {{ .Values.api.grpcPort }}
        {{- if .Values.envoy.memberHttps.tlsSecretName }}
        {{- $app := include "illamhelp-app.fullname" . }}
        {{- range $cluster, $endpoint := dict
              "member_web" (list (printf "%s-web" $app) .Values.web.port)
              "member_api" (list (printf "%s-api" $app) .Values.api.httpPort)
              "member_grpc_web" (list (printf "%s-envoy" $app) .Values.envoy.port)
              "member_keycloak" (list .Values.ingress.keycloakServiceName 8080) }}
        - name: {{ $cluster }}
          connect_timeout: 2s
          type: STRICT_DNS
          dns_lookup_family: V4_ONLY
          load_assignment:
            cluster_name: {{ $cluster }}
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ index $endpoint 0 }}
                          port_value: {{ index $endpoint 1 }}
        {{- end }}
        {{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "illamhelp-app.fullname" . }}-envoy
  labels:
    {{- include "illamhelp-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
spec:
  replicas: {{ .Values.envoy.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: envoy
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: envoy
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "illamhelp-app.podSecurityContext" . | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: envoy
          securityContext:
            {{- include "illamhelp-app.containerSecurityContext" . | nindent 12 }}
            runAsUser: 101
            runAsGroup: 101
          image: "{{ .Values.images.envoy.repository }}:{{ .Values.images.envoy.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.envoy.port }}
            {{- if .Values.envoy.memberHttps.tlsSecretName }}
            - name: member-https
              containerPort: {{ .Values.envoy.memberHttps.port }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.envoy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/envoy/envoy.yaml
              subPath: envoy.yaml
              readOnly: true
            {{- if .Values.envoy.memberHttps.tlsSecretName }}
            - name: member-tls
              mountPath: /etc/envoy/member-tls
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.envoy.memberHttps.tlsSecretName }}
        - name: member-tls
          secret:
            secretName: {{ .Values.envoy.memberHttps.tlsSecretName | quote }}
        {{- end }}
        - name: config
          configMap:
            name: {{ include "illamhelp-app.fullname" . }}-envoy
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "illamhelp-app.fullname" . }}-envoy
  labels:
    {{- include "illamhelp-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: envoy
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: envoy
  ports:
    - name: http
      port: {{ .Values.envoy.port }}
      targetPort: http

    {{- if .Values.envoy.memberHttps.tlsSecretName }}
    - name: member-https
      port: {{ .Values.envoy.memberHttps.port }}
      targetPort: member-https
    {{- end }}
